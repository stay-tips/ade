services:
  desktop-telematico:
    image: enrico508/desktop-telematico:latest
    platform: linux/amd64
    container_name: desktop-telematico
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - TITLE=Desktop Telematico
      # i3 è un WM non-reparenting: senza questa le app Java mostrano finestre grigie
      - _JAVA_AWT_WM_NONREPARENTING=1
    volumes:
      # app + dati (utenza locale, database, ambiente di sicurezza):
      # volume Docker nominato, sopravvive a update e ricreazioni
      - dt-app:/opt/DT
      # home del desktop (config i3, DPI, ecc.)
      - ./data:/config
      # cartella di scambio col computer: tracciati F24 in entrata, ricevute in uscita
      - ./f24:/config/f24
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  dt-app:
